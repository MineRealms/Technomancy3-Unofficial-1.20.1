modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Original Technomancy by Democretes, theflogat and Mordenkainen. Unofficial modern port."
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="thaumcraft"
mandatory=true
versionRange="[${thaumcraft_runtime_version}]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="gtceu"
mandatory=false
versionRange="[${gtceu_version}]"
ordering="AFTER"
side="BOTH"
