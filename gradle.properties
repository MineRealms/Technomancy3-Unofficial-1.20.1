# JEI. Pinned to TC4R's side of the conflict, because TC4R is mandatory and GTCEu is optional.
# `tools/jei_api_matrix.py` and `tools/jei_link_check.py` measure the whole 1.20.1-Forge line and
# the two consumers' requirements do not overlap at all:
#
#   * TC4R 0.1.0-20721's JEI plugin is built against the 15.56+ API: it calls
#     `mezz.jei.api.ingredients.subtypes.ISubtypeInterpreter` (absent until the 15.48-15.55
#     range) and `ITextWidget.setPosition(int, int)` (added at 15.56.0.202). `jei_link_check.py`
#     reports 9 broken call sites against 15.20.0.115 and 0 against 15.56.0.205 / 15.62.0.216.
#     On older JEI those throw inside `thaumcraft:jei_plugin`; JEI's `PluginCaller` catches plugin
#     errors individually so the game still runs, but Thaumcraft loses its JEI item subtypes and
#     its whole `thaumcraft:aspect_sources` category.
#   * GTCEu 7.5.3's `jei.FluidHelperMixin` injects into
#     `FluidHelper.getTooltip(ITooltipBuilder, FluidStack, TooltipFlag)`, a signature JEI
#     reverted to `getTooltip(List<Component>, FluidStack, TooltipFlag)` at 15.40.0.176. The
#     annotation's `require = 0` does NOT save this: `require` only covers "selector matched no
#     target" (Mixin's `InjectionInfo.validateTargets` skips when `requiredCallbackCount <= 0`);
#     here the by-name selector still finds the surviving `getTooltip` overload and
#     `CallbackInjector` then rejects the handler descriptor, which is fatal. So GTCEu needs
#     <= 15.35.0.175. GTCEu 8.0.0's mixin is unchanged.
#
# The port bridges the gap itself: `src/main/java/theflogat/technomancy/mixin/
# GtceuJeiFluidHelperMixin.java` re-adds that overload to JEI's `FluidHelper` as an empty stub
# (registered through `technom.mixins.json` at priority 900, so it applies before GTCEu's
# default-1000 mixin). Nothing calls the method - JEI 15.56 has no `ITooltipBuilder` overload
# anywhere - so the only effect is that GTCEu's selector finds a target and the client starts.
#
# Two consequences worth remembering:
#   * The crash is client-only. `mezz.jei.forge.platform.FluidHelper` is never loaded on a
#     dedicated server, so `runServer` / `runGameTestServer -PwithGtceu=true` never hit it.
#   * A pack that already carries an equivalent shim (the Sunlit Valley pack ships
#     `pollution-...jar`, whose `FluidHelperCompatMixin` does the same thing at the same
#     priority) just wins the race. The loser is reported as a "Method overwrite conflict ...
#     Skipping method" warning and the outcome is identical, because both bodies are empty.
#
# Revisit if TC4R lowers its JEI floor or GTCEu raises it.
jei_version=15.56.0.205
# Jade (the WAILA successor). Published on the Modrinth maven; 11.13.3+forge is the
# 1.20.1-Forge line. The plugin itself lives in common code because Jade loads on both
# sides, so the compile API is always present and the flag only changes the dev runtime.
jade_version=11.13.3+forge
# KubeJS. compileOnly by default: it is a large scripting engine and is kept out of the normal
# development runtime, or it changes startup and the resource reload for every test. Set
# -PwithKubejs=true to install it and actually exercise the plugin.
kubejs_version=2001.6.5-build.26
# KubeJS declares both of these mandatory in its mods.toml, so -PwithKubejs=true needs them too.
# They are mods, not libraries: both have to be on the runtime as mod jars of their own.
rhino_version=2001.2.2-build.17
architectury_version=9.1.12

# The compile API is always present; this flag adds GTCEu to the development runtime.
withGtceu=false
